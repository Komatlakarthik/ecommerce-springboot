<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ShopZone - Admin Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</h2>
        <a th:href="@{/admin/products/add}" class="btn btn-primary rounded-pill"><i class="bi bi-plus-circle me-2"></i>Add Product</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-custom"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center p-3">
                <i class="bi bi-box-seam display-4 text-primary"></i>
                <h3 th:text="${#lists.size(products)}">0</h3>
                <p class="text-muted mb-0">Products</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <i class="bi bi-receipt display-4 text-success"></i>
                <h3 th:text="${#lists.size(orders)}">0</h3>
                <p class="text-muted mb-0">Orders</p>
            </div>
        </div>
    </div>

    <!-- Products -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-grid me-2"></i>Products</h5></div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}">1</td>
                        <td th:text="${product.name}">Product</td>
                        <td th:text="${product.category}">Category</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
                        <td th:text="${product.stock}">0</td>
                        <td><span class="badge" th:classappend="${product.active} ? 'bg-success' : 'bg-danger'" th:text="${product.active} ? 'Active' : 'Inactive'">Status</span></td>
                        <td>
                            <a th:href="@{'/admin/products/edit/' + ${product.id}}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{'/admin/products/delete/' + ${product.id}}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this product?')"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Orders -->
    <div class="card shadow-sm">
        <div class="card-header bg-white"><h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Orders</h5></div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr><th>Order #</th><th>Customer</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}">1</td>
                        <td th:text="${order.user.username}">User</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${order.status.name() == 'CONFIRMED'} ? 'bg-success' : (${order.status.name() == 'SHIPPED'} ? 'bg-info' : (${order.status.name() == 'DELIVERED'} ? 'bg-primary' : (${order.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-warning')))"
                                  th:text="${order.status}">Status</span>
                        </td>
                        <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}">Date</td>
                        <td>
                            <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post" class="d-inline">
                                <select name="status" class="form-select form-select-sm d-inline" style="width: auto;" onchange="this.form.submit()">
                                    <option value="">Change...</option>
                                    <option value="PENDING">Pending</option>
                                    <option value="CONFIRMED">Confirmed</option>
                                    <option value="SHIPPED">Shipped</option>
                                    <option value="DELIVERED">Delivered</option>
                                    <option value="CANCELLED">Cancelled</option>
                                </select>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
