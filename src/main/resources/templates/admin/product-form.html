<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ShopZone - Product Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h3 class="mb-4"><i class="bi bi-box-seam me-2 text-primary"></i>
                    <span th:text="${product.id != null} ? 'Edit Product' : 'Add New Product'">Product Form</span>
                </h3>

                <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                        <div th:if="${#fields.hasErrors('name')}" class="text-danger small" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price ($)</label>
                            <input type="number" th:field="*{price}" class="form-control" step="0.01" min="0.01" required>
                            <div th:if="${#fields.hasErrors('price')}" class="text-danger small" th:errors="*{price}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" min="0" required>
                            <div th:if="${#fields.hasErrors('stock')}" class="text-danger small" th:errors="*{stock}"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select th:field="*{category}" class="form-select">
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Footwear">Footwear</option>
                            <option value="Home & Kitchen">Home &amp; Kitchen</option>
                            <option value="Books">Books</option>
                            <option value="Sports">Sports</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image URL</label>
                        <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" th:field="*{active}" class="form-check-input">
                        <label class="form-check-label">Active</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">
                        <i class="bi bi-check-circle me-2"></i>Save Product
                    </button>
                </form>
                <a th:href="@{/admin}" class="btn btn-outline-secondary mt-3 rounded-pill w-100"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
