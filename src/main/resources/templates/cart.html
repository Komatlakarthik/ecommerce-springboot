<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ShopZone - Cart')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <h2 class="mb-4"><i class="bi bi-cart3 me-2"></i>Shopping Cart</h2>

    <div th:if="${success}" class="alert alert-success alert-custom"><i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span></div>
    <div th:if="${error}" class="alert alert-danger alert-custom"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span></div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <h4 class="text-muted mt-3">Your cart is empty</h4>
        <a th:href="@{/products}" class="btn btn-primary rounded-pill mt-2"><i class="bi bi-bag me-2"></i>Continue Shopping</a>
    </div>

    <div th:if="${!#lists.isEmpty(cartItems)}">
        <div class="card shadow-sm mb-4">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="${item.product.imageUrl}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;" class="me-3"
                                         onerror="this.src='https://via.placeholder.com/60x60?text=P'">
                                    <div>
                                        <strong th:text="${item.product.name}">Product</strong>
                                        <br><small class="text-muted" th:text="${item.product.category}">Category</small>
                                    </div>
                                </div>
                            </td>
                            <td class="align-middle" th:text="'$' + ${#numbers.formatDecimal(item.product.price, 1, 2)}">$0.00</td>
                            <td class="align-middle">
                                <form th:action="@{'/cart/update/' + ${item.id}}" method="post" class="d-inline">
                                    <div class="input-group" style="width: 130px;">
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm">
                                        <button class="btn btn-outline-primary btn-sm" type="submit"><i class="bi bi-arrow-repeat"></i></button>
                                    </div>
                                </form>
                            </td>
                            <td class="align-middle fw-bold" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</td>
                            <td class="align-middle">
                                <form th:action="@{'/cart/remove/' + ${item.id}}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill"><i class="bi bi-trash me-1"></i>Remove</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row justify-content-end">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="mb-3">Order Summary</h5>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Total:</span>
                            <span class="price-tag fs-4" th:text="'$' + ${#numbers.formatDecimal(total, 1, 2)}">$0.00</span>
                        </div>
                        <a th:href="@{/orders/checkout}" class="btn btn-primary w-100 rounded-pill mt-2">
                            <i class="bi bi-credit-card me-2"></i>Proceed to Checkout
                        </a>
                        <a th:href="@{/products}" class="btn btn-outline-secondary w-100 rounded-pill mt-2">
                            <i class="bi bi-bag me-2"></i>Continue Shopping
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
