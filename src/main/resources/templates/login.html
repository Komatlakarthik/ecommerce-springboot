<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ShopZone - Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right me-2 text-primary"></i>Login</h3>

                <div th:if="${param.error}" class="alert alert-danger alert-custom">
                    <i class="bi bi-exclamation-triangle me-2"></i>Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success alert-custom">
                    <i class="bi bi-check-circle me-2"></i>You have been logged out.
                </div>
                <div th:if="${success}" class="alert alert-success alert-custom">
                    <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-person me-1"></i>Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>
                <p class="text-center mt-3 text-muted">Don't have an account? <a th:href="@{/register}">Register here</a></p>
                <hr>
                <p class="text-center small text-muted mb-0">Admin login: <strong>admin / admin123</strong></p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
