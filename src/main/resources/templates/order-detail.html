<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ShopZone - Order Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container my-5">
    <div th:if="${order != null}">
        <h2>Order #<span th:text="${order.id}"></span></h2>
        <span class="badge bg-primary" th:text="${order.status}">Status</span>
        <p class="text-muted mt-2" th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}"></p>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table">
                    <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.product.name}">Product</td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}">$0.00</td>
                            <td th:text="${item.quantity}">1</td>
                            <td th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">$0.00</td>
                        </tr>
                    </tbody>
                </table>
                <h4 class="text-end price-tag">Total: $<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span></h4>
                <p><strong>Shipping:</strong> <span th:text="${order.shippingAddress}">Address</span></p>
            </div>
        </div>
        <a th:href="@{/orders}" class="btn btn-outline-primary mt-3 rounded-pill"><i class="bi bi-arrow-left me-1"></i>Back to Orders</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
